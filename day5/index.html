<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 | Fetch API Users</title>
    <script src="users.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: 0 auto;
            padding: 24px;
            background: #f1f5f9;
            color: #1e293b;
        }

        header,
        main {
            background: white;
            padding: 24px;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        header {
            background: #0f766e;
            color: white;
        }

        label {
            display: block;
            margin: 16px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }

        button {
            margin-top: 16px;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #0f766e;
            color: white;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #115e59;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            min-height: 24px;
            font-weight: bold;
        }

        #users-list {
            list-style: none;
            padding: 0;
        }

        .user-card {
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .user-card h3 {
            margin-top: 0;
            color: #0f766e;
        }

        .user-card p {
            margin: 6px 0;
        }
    </style>
</head>

<body>
    <header>
        <h1>Day 5: Fetch API Users</h1>
        <p>Load users from an API and filter them without another request.</p>
    </header>

    <main>
        <section aria-labelledby="users-heading">
            <h2 id="users-heading">User Directory</h2>

            <button id="load-users" type="button">Load Users</button>

            <p id="status" role="status" aria-live="polite">
                Click "Load Users" to retrieve users.
            </p>

            <label for="filter-input">Filter users by name</label>
            <input type="text" id="filter-input" placeholder="Start typing a name...">

            <ul id="users-list"></ul>
        </section>
    </main>
</body>

</html>
